name: gcf
services:
  database:
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    environment:
      SQLD_NODE: primary
    volumes:
      - database:/var/lib/sqld
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: infra/sqitch/Dockerfile
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-http://database:8080}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    volumes:
      - sqitch:/state
    depends_on:
      database:
        condition: service_healthy
    networks: [internal, public]
  app:
    build: .
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-http://database:8080}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    networks: [internal, public]
volumes:
  database:
  sqitch:
networks:
  internal:
    internal: true
  public:
