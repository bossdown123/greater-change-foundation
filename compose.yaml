name: gcf
services:
  database:
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    environment:
      SQLD_NODE: primary
    volumes:
      - database:/var/lib/sqld
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
  storage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Configure local .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Configure local .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Configure local .env}
      GARAGE_DEFAULT_BUCKET: gcf-media
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - media:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "gcf-media"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped
    networks: [internal]
  migrate:
    build:
      context: .
      dockerfile: infra/sqitch/Dockerfile
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-http://database:8080}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    volumes:
      - sqitch:/state
    depends_on:
      database:
        condition: service_healthy
    networks: [internal, public]
  app:
    build: .
    environment:
      GCF_SESSION_SECRET: ${GCF_SESSION_SECRET:?Configure local .env}
      GCF_ADMIN_EMAIL: ${GCF_ADMIN_EMAIL:?Configure initial administrator email}
      GCF_ADMIN_PASSWORD_HASH: ${GCF_ADMIN_PASSWORD_HASH:?Configure local .env}
      GCF_COOKIE_SECURE: "false"
      S3_ENDPOINT: http://storage:3900
      S3_BUCKET: gcf-media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-http://database:8080}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    networks: [internal, public]
volumes:
  media:
  database:
  sqitch:
networks:
  internal:
    internal: true
  public:
