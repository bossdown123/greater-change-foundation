name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gcf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.4'
      - uses: actions/cache@v4
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: beam-${{ runner.os }}-otp27-${{ hashFiles('apps/api/mix.lock') }}
      - name: Check backend
        working-directory: apps/api
        env:
          GCF_SERVE: 'false'
          MIX_ENV: test
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
          mix hex.audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build && node --experimental-strip-types collaboration-state.test.mjs && node --experimental-strip-types live-fields.test.mjs && node --experimental-strip-types autosave.test.mjs && node --experimental-strip-types merge-draft.test.mjs && node rich-document.test.mjs && node collaboration-ui.test.mjs && node public-site.test.mjs
        working-directory: apps/web
      - name: Verify relational constraints
        run: |
          python3 infra/tests/normalization.py
          python3 infra/tests/identity_audit.py
          python3 infra/tests/media_metadata.py
          python3 infra/tests/realtime_presence.py
          python3 infra/tests/rich_documents.py
          python3 infra/tests/publication_views.py
      - name: Verify migrations against Turso
        run: |
          cp .env.example .env
          python3 deploy/local-secrets.py
          docker compose up -d database
          docker compose build migrate
          docker compose run --rm migrate deploy --verify
          docker compose run --rm migrate revert -y
          docker compose run --rm migrate deploy --verify
          docker compose run --rm migrate verify
          docker compose run --rm -e GCF_TEST_DATABASE=1 --entrypoint python3 migrate /migrations/tests/atomicity.py
      - name: Check admin with real database and object storage
        run: |
          docker compose up -d --build --wait app
          GCF_TEST_DATABASE=1 python3 infra/tests/admin_smoke.py
          GCF_TEST_IDENTITY=1 GCF_TEST_URL=http://127.0.0.1:4000 python3 infra/tests/account_smoke.py
          GCF_TEST_DATABASE=1 python3 infra/tests/metadata_smoke.py
          GCF_TEST_DATABASE=1 python3 infra/tests/realtime_smoke.py
          GCF_TEST_DATABASE=1 python3 infra/tests/rich_documents_smoke.py
          GCF_TEST_DATABASE=1 python3 infra/tests/publication_smoke.py
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bossdown123/greater-change-foundation:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/sqitch/Dockerfile
          push: true
          tags: ghcr.io/bossdown123/greater-change-foundation-migrations:${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations
      - name: Deploy verified release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gcf
          chmod 600 ~/.ssh/gcf
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opts=(-i ~/.ssh/gcf -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${opts[@]}" root@"$DEPLOY_HOST" 'install -d -m 700 /opt/greater-change-foundation/deploy'
          scp "${opts[@]}" deploy/compose.yaml deploy/Caddyfile deploy/garage.toml deploy/release.sh root@"$DEPLOY_HOST":/opt/greater-change-foundation/deploy/
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" root@"$DEPLOY_HOST" 'install -d -m 700 /run/gcf-registry; docker --config /run/gcf-registry login ghcr.io -u bossdown123 --password-stdin'
          trap 'ssh "${opts[@]}" root@"$DEPLOY_HOST" "rm -rf /run/gcf-registry"' EXIT
          ssh "${opts[@]}" root@"$DEPLOY_HOST" 'DOCKER_CONFIG=/run/gcf-registry bash /opt/greater-change-foundation/deploy/release.sh ghcr.io/bossdown123/greater-change-foundation:${{ github.sha }} ghcr.io/bossdown123/greater-change-foundation-migrations:${{ github.sha }}'
